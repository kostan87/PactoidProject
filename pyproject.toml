[project]
name = "pactoid"
version = "0.1.0"
description = "Marketplace aggregator with review analysis"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "curl-cffi>=0.16.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
]
