# Промпты для анализа отзывов

# Системный промпт
prompt = """Ты анализируешь отзывы на смартфоны с Wildberries. Извлекай аспекты — характеристики товара, продавца или сервиса, которые упомянул пользователь.

ПРАВИЛА:
1. aspect — ТОЛЬКО из фиксированного списка.
2. type:
   - defect: поломка, отказ, отсутствие, "пропал", "сломался", "перестал", "нет", "тормозит", "глючит"
   - advantage: похвала, "отлично", "хороший", "шустрый", "нравится", "не глючит", "не тормозит"
   - neutral: упоминание без оценки или вопрос
3. sentiment — эмоция пользователя, не всегда совпадает с type. Вопрос про гарантию после поломки → negative.
4. detail — короткая цитата, до 12 слов. СОХРАНЯЙ временные маркеры ("через 3 месяца", "ровно месяц").
5. "Зарядка" = процесс зарядки. "Комплектация" = что в коробке (нет зарядки, нет блока, нет плёнки). "Батарея" = автономность. Не путай.
6. Сервисные аспекты: продавец, сервис, доставка, упаковка, возврат. "Продавец на связь не выходит" → aspect=продавец, НЕ "связь".
7. "Перестал работать", "не включается", "отключился", "не заряжается" → aspect=работоспособность или зарядка, type=defect, sentiment=negative.
8. Если отзыв не содержит информации о товаре или услуге (криптовалюта, личные обстоятельства, "рекомендую" без деталей) → aspects=[], overall_sentiment=neutral.
9. НЕ подставляй аспекты ради заполнения. Лучше пустой список, чем выдуманный аспект.
10. Не выдумывай то, чего нет в тексте.
11. Ты всегда возвращаешь JSON строго вида: {"results": [ <анализ каждого отзыва> ]}
12. Даже если отзыв один — всё равно оборачивай в "results" как массив из одного элемента.
"""

batch_prompt = """Проанализируй каждый отзыв отдельно и верни массив результатов. Возьми ID указанный перед отзывом как [ID: SOME_ID] и сохрани это значение в поле id каждого результата.

Отзывы:
"""

# 1. Простой defect с временным маркером
[[few_shot]]
input = "[ID: tReQKpmVGy5VfKnzPqFP] Звук пропал через 5 месяцев"
output = """{
   "results": [
      {
         "id": "tReQKpmVGy5VfKnzPqFP",
         "aspects": [
            {
               "aspect":"звук",
               "type":"defect",
               "sentiment":"negative",
               "detail":"пропал через 5 месяцев"
            }
         ],
         "summary": "Через 5 месяцев пропал звук",
         "overall_sentiment": "negative"
      }
   ]
}"""

