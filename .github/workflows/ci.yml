name: Pactoid
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pactoid
          POSTGRES_DB: pactoid_db
          POSTGRES_PASSWORD: pactoid_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Create tables
        run: uv run python -m scripts.create_tables
        env:
          DATABASE_URL: postgresql+psycopg://pactoid:pactoid_pass@localhost:5432/pactoid_db

      - name: Run test suite
        run: uv run pytest -v
        env:
          DATABASE_URL: postgresql+psycopg://pactoid:pactoid_pass@localhost:5432/pactoid_db