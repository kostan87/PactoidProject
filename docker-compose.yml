services:
  app:
    build: .
    container_name: pactoid_app
    volumes:
      - .:/app
      - /app/.venv   # .venv не перезаписывается хостом
      - ~/.ssh:/root/.ssh:ro
      - vscode-server:/root/.vscode-server
    environment:
      - DATABASE_URL=postgresql+psycopg://pactoid:pactoid_pass@postgres:5432/pactoid_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://host.docker.internal:11434
      - GIT_SSH_COMMAND=ssh -i /root/.ssh-local/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
    depends_on:
      - postgres
      - redis
    tty: true

  postgres:
    image: postgres:16
    container_name: pactoid_postgres
    environment:
      POSTGRES_USER: pactoid
      POSTGRES_PASSWORD: pactoid_pass
      POSTGRES_DB: pactoid_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pactoid_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: pactoid_web
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - DATABASE_URL=postgresql+psycopg://pactoid:pactoid_pass@postgres:5432/pactoid_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: uv run uvicorn app.web.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
  vscode-server: